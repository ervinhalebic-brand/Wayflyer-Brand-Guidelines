<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wayflyer | Ad Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
<style>
:root{
  --r-xs:4px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-pill:999px;
    --bg:#F2F2F7;--bg2:#FFFFFF;--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);
  --label:#000000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.22);
  --ink:#000000;--on-ink:#FFFFFF;--accent:#001EFF;--pink:#FF2D55;--green:#34C759;--thumb:#FFFFFF;--bar:rgba(242,242,247,.8);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000000;--bg2:#1C1C1E;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);--label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);--ink:#FFFFFF;--on-ink:#000000;--accent:#5266FF;--pink:#FF375F;--green:#30D158;--thumb:#636366;--bar:rgba(22,22,24,.78);}
}
:root[data-theme="dark"]{--bg:#000000;--bg2:#1C1C1E;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);--label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);--ink:#FFFFFF;--on-ink:#000000;--accent:#5266FF;--pink:#FF375F;--green:#30D158;--thumb:#636366;--bar:rgba(22,22,24,.78);}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
html,body{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.29 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;letter-spacing:-.022em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px;border-radius:var(--r-sm)}
h1,h2,h3{margin:0;font-weight:500}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:260px minmax(0,1fr) 400px;grid-template-rows:auto 1fr;min-height:100%}
.app.is-final{grid-template-columns:260px minmax(0,1fr)}
.app.is-final .preview,.app.is-final .bottom-bar{display:none}

/* nav bar */
.nav{grid-column:1/-1;position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto;align-items:center;min-height:52px;padding:0 12px 0 24px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.nav-back{justify-self:end;display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--ink);font-size:17px;min-height:44px;padding:0 8px;cursor:pointer}
.nav-back svg{width:24px;height:24px;stroke-width:2;margin-left:-6px}
.nav-back:active{opacity:.4}
.nav-title{text-align:left;line-height:1.15}
.nav-title .bar{color:var(--label3);font-weight:400;margin:0 2px}
.nav-title strong{display:block;font-size:17px;font-weight:500}
.nav-title > span{font-size:12px;color:var(--label2)}
.progress{position:absolute;left:0;right:0;bottom:-.5px;height:2px}
.progress i{position:relative;display:block;height:100%;width:0;border-radius:0 var(--r-pill) var(--r-pill) 0;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,transparent),var(--accent));transition:width .7s cubic-bezier(.22,1,.36,1)}
.progress i::after{content:"";position:absolute;right:-6px;top:50%;width:28px;height:8px;transform:translateY(-50%);border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 55%,transparent),transparent);opacity:0;transition:opacity .3s ease}
.progress i.moving::after{opacity:1}

/* sidebar */
.sidebar{padding:20px 12px;border-right:.5px solid var(--sep)}
.side-h{font-size:13px;color:var(--label2);margin:0 12px 8px;font-weight:500}
.sidebar ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.side-row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:none;border-radius:var(--r-md);padding:8px 12px;min-height:52px;cursor:pointer}
.side-row:disabled{cursor:default;opacity:.35}
.side-row:not(:disabled):not([aria-current]):hover{background:var(--fill)}
.side-row .ic{width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--ink);color:var(--on-ink);flex:none}
.side-row .ic svg{width:19px;height:19px;stroke-width:1.7}
.side-row.done .ic{background:var(--green)}
.side-row .tx{display:grid;min-width:0;flex:1}
.side-row .l{font-size:15px;font-weight:500}
.side-row .s{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-row[aria-current="step"]{background:var(--ink);color:var(--on-ink)}
.side-row[aria-current="step"] .s{color:color-mix(in srgb,var(--on-ink) 68%,transparent)}
.side-row[aria-current="step"] .ic{background:var(--accent);color:#fff}

/* main */
main{display:flex;flex-direction:column;min-width:0}
#step{flex:1;padding:28px 40px 32px;outline:none}
.large-title{font-size:34px;line-height:41px;letter-spacing:.012em;font-weight:500;outline:none}
.lede{color:var(--label2);font-size:17px;margin:6px 0 28px;max-width:60ch}
.bottom-bar{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:14px}
#step{padding-bottom:110px}
.bar-hint{font-size:13px;color:var(--label2);background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:6px 10px;border-radius:var(--r-sm)}
.bar-hint:empty{display:none}
#next{box-shadow:0 8px 24px -8px rgba(0,0,0,.35)}

/* buttons */
.btn{border:0;border-radius:var(--r-md);font-size:17px;font-weight:500;min-height:44px;padding:0 20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active:not(:disabled){opacity:.7}
.btn:disabled{opacity:.35;cursor:default}
.btn.filled{background:var(--ink);color:var(--on-ink)}
.btn.large{min-height:50px;min-width:220px;border-radius:var(--r-md)}
.btn.gray{background:var(--fill);color:var(--ink)}
.btn.plain{background:none;color:var(--ink);padding:0 8px;font-weight:400}
.btn.small{min-height:30px;font-size:15px;padding:0 12px;border-radius:var(--r-sm)}
.btn.wide{width:100%}

/* segmented control */
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:calc(var(--r-sm) + 2px);padding:2px}
.seg button{border:0;background:none;border-radius:var(--r-sm);min-height:28px;padding:3px 12px;font-size:13px;font-weight:500;letter-spacing:-.006em;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--thumb);font-weight:500;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}

/* switch */
input.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:var(--r-pill);background:var(--fill2);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
input.switch::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .2s}
input.switch:checked{background:var(--green)}
input.switch:checked::before{transform:translateX(20px)}

/* option tiles */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;max-width:900px}
.opts.layouts{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.opt{position:relative;display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--bg2);border:0;border-radius:var(--r-md);padding:18px;cursor:pointer;min-height:100px;transition:box-shadow .15s}
.opt[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.opt:disabled{opacity:.35;cursor:default}
.opt:active:not(:disabled){transform:scale(.985)}
.opt-t{font-size:20px;font-weight:500;letter-spacing:-.02em;padding-right:28px}
.opt-d{color:var(--label2);font-size:15px}
.badge{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--label3);display:grid;place-items:center}
.badge svg{width:15px;height:15px;color:#fff;stroke-width:2.4;opacity:0}
.opt[aria-pressed="true"] .badge{background:var(--accent);border-color:var(--accent)}
.opt[aria-pressed="true"] .badge svg{opacity:1}
.opt .fig{height:120px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:10px}
.frame{border:2px solid var(--label2);border-radius:var(--r-xs);background:var(--fill)}
.opt[aria-pressed="true"] .frame{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.phone{width:60px;height:112px;border:2px solid var(--label2);border-radius:var(--r-md);padding:14px 6px;display:flex;flex-direction:column;gap:4px}
.phone i{display:block;height:4px;border-radius:var(--r-xs);background:var(--fill2)}
.phone b{display:block;flex:none;aspect-ratio:1;background:var(--accent);opacity:.8;border-radius:var(--r-xs)}
.phone.full{padding:0;overflow:hidden}
.phone.full b{flex:1;aspect-ratio:auto;border-radius:0}
.tile-cv{width:100%;height:auto;display:block;border-radius:var(--r-sm);margin-bottom:10px;background:var(--fill)}
.callout{margin-top:20px;max-width:62ch;display:flex;gap:12px;padding:14px 16px;background:var(--bg2);border-radius:var(--r-md);font-size:15px}
.callout svg{color:var(--accent);margin-top:1px}

/* grouped lists */
.form{display:grid;gap:30px;max-width:640px}
.group{display:grid;gap:7px}
.group-h{font-size:13px;font-weight:400;color:var(--label2);margin:0 16px;letter-spacing:-.006em}
.group-f{font-size:13px;color:var(--label2);margin:0 16px}
.list{background:var(--bg2);border-radius:var(--r-md);overflow:hidden}
.cell{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:44px;padding:7px 16px;position:relative;width:100%;border:0;background:none;text-align:left}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
@media (max-resolution:1dppx){.cell+.cell::before{height:1px;opacity:.6}}
.cell.stack{flex-direction:column;align-items:stretch;gap:3px;padding:10px 16px}
.cell.stack .cl{font-size:13px;color:var(--label2)}
.cell input[type=text],.cell textarea{border:0;background:none;font-size:17px;padding:0;outline:none;width:100%;resize:none;line-height:1.3}
.cell textarea{min-height:44px}
.detail{color:var(--label2)}
button.cell{cursor:pointer;color:var(--label)}
button.cell:active,button.cell:hover{background:var(--fill)}
.chev{width:18px;height:18px;color:var(--label3);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.slider{display:flex;align-items:center;gap:10px;flex:1;max-width:260px}
.slider output{min-width:46px;text-align:right;color:var(--label2);font-size:15px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=range]:disabled{opacity:.35}
input[type=color]{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:50%;border:0;padding:0;background:none;cursor:pointer;flex:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border-radius:50%;border:.5px solid var(--sep)}
input[type=color]::-moz-color-swatch{border-radius:50%;border:.5px solid var(--sep)}
.drop{display:grid;place-items:center;text-align:center;gap:6px;padding:28px 16px;cursor:pointer;color:var(--label2);font-size:15px}
.drop strong{color:var(--ink);font-size:17px;font-weight:400}
.drop svg{width:36px;height:36px;color:var(--accent);stroke-width:1.4}
.drop.over{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:var(--r-sm);flex:none}
.fname-cell{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;padding:14px 16px;width:100%}
.sw{display:flex;flex-direction:column;gap:8px;align-items:center;padding:10px 6px;border:0;border-radius:var(--r-md);background:none;cursor:pointer;font-size:13px}
.sw:hover{background:var(--fill)}
.sw[aria-pressed="true"]{background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink);font-weight:500}
.sw .chips{display:flex;width:56px;height:56px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 .5px var(--sep)}
.sw[aria-pressed="true"] .chips{box-shadow:0 0 0 2.5px var(--bg2),0 0 0 4.5px var(--ink)}
.sw .chips i{flex:1}
.sw .chips i:first-child{flex:2}
.sw .aa{width:56px;height:56px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--fill);font-size:26px;color:var(--label)}
.sw[aria-pressed="true"] .aa{box-shadow:0 0 0 2.5px var(--ink)}

/* preview */
.preview{border-left:.5px solid var(--sep);padding:24px;display:flex;flex-direction:column;gap:10px;position:sticky;top:52px;align-self:start;max-height:calc(100vh - 52px)}
.preview h3{font-size:13px;font-weight:400;color:var(--label2);margin:0 4px}
#pv{display:block;max-width:100%;max-height:calc(100vh - 250px);width:auto;height:auto;margin:0 auto;border-radius:var(--r-sm);box-shadow:0 10px 30px rgba(0,0,0,.14)}
.preview p{margin:0;font-size:13px;color:var(--label2);text-align:center}

/* editor */
#step.finish{padding:20px 24px 28px}
.editor{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.formats{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:14px}
.fmt .fr{width:11px;border:1.5px solid currentColor;border-radius:var(--r-xs);flex:none}
.stage{display:grid;place-items:center;padding:32px 20px;border-radius:var(--r-lg);background:var(--bg2)}
.board{position:relative;line-height:0}
#main{display:block;max-width:100%;max-height:min(68vh,980px);width:auto;height:auto;touch-action:none;border-radius:var(--r-xs);box-shadow:0 12px 36px rgba(0,0,0,.2),0 0 0 .5px var(--sep)}
.footnote{color:var(--label2);font-size:13px;margin:10px 16px 0;text-align:center}
.inspector{display:grid;gap:24px;position:sticky;top:68px}
.aligns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px;width:100%}
.aligns button{border:0;background:var(--fill);color:var(--ink);border-radius:var(--r-sm);min-height:36px;font-size:13px;font-weight:500;cursor:pointer}
.aligns button:active{opacity:.6}
.status{font-size:13px;color:var(--label2);min-height:1.2em;margin:0 16px}
.exp-cell{padding:12px 16px;display:grid;gap:10px;width:100%}

@media (max-width:1200px){
  .app{grid-template-columns:240px minmax(0,1fr) 320px}
  .editor{grid-template-columns:1fr}
  .inspector{position:static}
}
@media (max-width:860px){
  .app,.app.is-final{grid-template-columns:1fr;grid-template-rows:auto auto auto auto}
  .sidebar{display:none}
  #step{padding:20px 16px 28px}
  .large-title{font-size:30px;line-height:36px}
  .bottom-bar{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .bottom-bar{left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .bottom-bar .btn.large{flex:1;min-width:0}
  .bar-hint{display:none}
  .preview{position:static;border-left:0;border-top:.5px solid var(--sep);max-height:none;padding:20px 16px}
  #pv{max-height:60vh}
  .stage{padding:20px 12px}
  #step.finish{padding:14px 12px 24px}
  .slider{max-width:200px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* welcome */
.app.is-welcome{grid-template-columns:260px minmax(0,1fr)}
.app.is-welcome .preview{display:none}
.app.is-welcome .bottom-bar{display:none}
.app.is-welcome #step{display:grid;place-items:center;padding:32px 40px}
.app.is-welcome .welcome{margin:0 auto}
.welcome{max-width:640px;margin:12px auto 0;text-align:center;display:grid;justify-items:center}
.app-icon{width:88px;height:88px;border-radius:var(--r-xl);display:grid;place-items:center;color:#fff;margin-bottom:20px;background:#000;box-shadow:0 10px 24px -10px rgba(0,0,0,.45)}
.btn.start{min-height:48px;height:48px;padding:0 24px;border-radius:var(--r-md);font-size:17px;background:#001EFF;color:#fff}
.app-icon .logo{width:40px;height:auto;display:block}
.w-lede{font-size:17px;line-height:1.47;color:var(--label2);margin:10px 0 30px;max-width:52ch}
.samples{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-bottom:36px}
.samples figure{margin:0;display:grid;gap:8px;justify-items:center}
.samples canvas{display:block;width:auto;border-radius:var(--r-sm);box-shadow:0 8px 22px rgba(0,0,0,.16),0 0 0 .5px var(--sep)}
.samples [data-sample="1080x1080"]{height:132px}.samples [data-sample="1080x1350"]{height:165px}.samples [data-sample="1080x1920"]{height:235px}
.samples figcaption{font-size:13px;color:var(--label2)}
.features{list-style:none;margin:0;padding:0;display:grid;gap:22px;text-align:left;max-width:480px}
.features li{display:flex;gap:16px;align-items:flex-start}
.features svg{width:30px;height:30px;color:var(--accent);stroke-width:1.5;margin-top:2px}
.features strong{display:block;font-size:17px;font-weight:500}
.features span{display:block;font-size:15px;color:var(--label2);line-height:1.4}
@media (max-width:860px){.app.is-welcome{grid-template-columns:1fr}.samples{gap:10px}.samples [data-sample="1080x1080"]{height:96px}.samples [data-sample="1080x1350"]{height:120px}.samples [data-sample="1080x1920"]{height:170px}}
.acc{display:grid;gap:10px}
.acc-item{display:grid;gap:10px}
.acc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;padding:0 16px;border:0;border-radius:var(--r-md);background:var(--bg2);font-size:17px;text-align:left;cursor:pointer;color:var(--label)}
.acc-head:hover{background:color-mix(in srgb,var(--bg2) 92%,var(--label))}
.acc-meta{display:flex;align-items:center;gap:8px}
.acc-chev{width:20px;height:20px;fill:none;stroke-width:2;color:var(--label2);transition:transform .25s cubic-bezier(.22,1,.36,1)}
.acc-item.open .acc-head{font-weight:500;border-radius:var(--r-md) var(--r-md) 0 0;margin-bottom:-10px;box-shadow:inset 0 -.5px 0 var(--sep)}
.acc-item.open .acc-chev{transform:rotate(180deg);color:var(--label)}
.acc-item.open .acc-panel{border-radius:0 0 var(--r-md) var(--r-md);animation:accIn .25s ease both}
@keyframes accIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.done-btn{width:100%;min-height:44px;font-size:17px}

/* library */
.app.is-library{grid-template-columns:260px minmax(0,1fr)}
.app.is-library .preview,.app.is-library .bottom-bar{display:none}
.side-sep{height:.5px;background:var(--sep);margin:10px 12px}
.lib-cell{color:var(--ink);cursor:pointer}
.lib-cell svg.i{color:var(--accent)}
.lib-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lib-bar .btn svg{width:18px;height:18px}
.lib-count{font-size:13px;color:var(--label2)}
.lib-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.lib-head .btn svg{width:18px;height:18px}
.lib-head .btn.small{min-height:38px;padding:0 16px}
.lib-tabs .seg button{min-height:32px;padding:4px 16px;font-size:14px}
.lib-n{color:var(--label2);font-weight:400;margin-left:2px}
.lib-note,.lib-msg{font-size:13px;color:var(--label2);margin:-4px 0 14px}
.lib-msg{color:var(--pink)}
.lib-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.lib-card{background:var(--bg2);border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column}
.lib-thumb{display:block;border:0;padding:0;margin:0;background:var(--fill);aspect-ratio:1;cursor:pointer;overflow:hidden}
.lib-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s cubic-bezier(.22,1,.36,1)}
.lib-thumb:hover img{transform:scale(1.04)}
.lib-meta{display:grid;gap:2px;padding:10px 12px 0}
.lib-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-dim{font-size:12px;color:var(--label2)}
.lib-actions{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 6px 12px 12px}
.lib-actions .btn{white-space:nowrap;font-size:13px;padding:0 12px;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lib-actions .icon-btn{flex:none}
.sheet .lib-meta{padding-bottom:10px}
.btn.small.gray{color:var(--ink)}
.btn.small.danger{background:var(--pink);color:#fff}
.icon-btn{border:0;background:none;width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--label2);cursor:pointer}
.icon-btn:hover{background:var(--fill);color:var(--label)}
.icon-btn svg{width:20px;height:20px}
.lib-empty{display:grid;justify-items:center;gap:6px;text-align:center;padding:48px 16px;color:var(--label2);font-size:15px;background:var(--bg2);border-radius:var(--r-md)}
.lib-empty svg{width:36px;height:36px;color:var(--label3)}
.lib-empty strong{color:var(--label);font-size:17px}
.sheet-backdrop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.36);display:grid;place-items:center;padding:24px;animation:fadeIn .2s ease both}
.sheet{width:min(880px,100%);max-height:min(80vh,820px);display:flex;flex-direction:column;background:var(--bg);border-radius:var(--r-lg);box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;animation:sheetIn .3s cubic-bezier(.22,1,.36,1) both}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px 24px;border-bottom:.5px solid var(--sep)}
.sheet-head h2{font-size:20px}
.sheet-body{padding:20px 24px 24px;overflow:auto}
.sheet .lib-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@media (max-width:860px){.app.is-library{grid-template-columns:1fr}.sheet-backdrop{padding:0;align-items:end}.sheet{border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:88vh}}
.pub-thumb{position:relative;aspect-ratio:1;background:var(--fill);overflow:hidden}
.pub-thumb img{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);object-fit:contain;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.pub-card .lib-dim+.lib-dim{margin-top:-1px}
.lib-actions .btn svg{width:16px;height:16px;flex:none}
.lib-actions .btn{gap:6px}
.lay-tabs{margin:-8px 0 10px}
.lay-tabs .seg button{min-height:32px;padding:4px 16px;font-size:14px}
.lay-note{font-size:13px;color:var(--label2);margin:0 0 18px}

/* ============================================================
   Visual language inspired by elevenlabs.io:
   monochrome, airy white surfaces, hairline borders,
   pill controls, light large headings with tight tracking.
   ============================================================ */
:root{
  --r-xs:6px;--r-sm:10px;--r-md:16px;--r-lg:24px;--r-xl:28px;
  --bg:#F7F7F7;--bg2:#FFFFFF;--fill:#F4F4F4;--fill2:#E7E7E7;
  --label:#0A0A0A;--label2:#6B6B6B;--label3:#A3A3A3;--sep:#EAEAEA;
  --ink:#0A0A0A;--on-ink:#FFFFFF;--thumb:#FFFFFF;--bar:rgba(255,255,255,.82);
  --shadow-sm:0 1px 2px rgba(10,10,10,.04);
  --shadow-md:0 1px 2px rgba(10,10,10,.04),0 12px 32px -16px rgba(10,10,10,.16);
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0A0A0A;--bg2:#141414;--fill:#1C1C1C;--fill2:#2A2A2A;--label:#FAFAFA;--label2:#A1A1A1;--label3:#5E5E5E;--sep:#262626;--ink:#FAFAFA;--on-ink:#0A0A0A;--thumb:#2A2A2A;--bar:rgba(10,10,10,.8)}
}
:root[data-theme="dark"]{--bg:#0A0A0A;--bg2:#141414;--fill:#1C1C1C;--fill2:#2A2A2A;--label:#FAFAFA;--label2:#A1A1A1;--label3:#5E5E5E;--sep:#262626;--ink:#FAFAFA;--on-ink:#0A0A0A;--thumb:#2A2A2A;--bar:rgba(10,10,10,.8)}

body{font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;letter-spacing:-.011em;font-feature-settings:"cv11","ss01"}
h1,h2,h3{font-weight:500}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg.i{stroke-width:1.4}

/* top bar */
.nav{background:var(--bar);border-bottom:1px solid var(--sep);min-height:56px;padding:0 16px 0 24px}
.nav-title strong{font-size:15px;font-weight:500;letter-spacing:-.02em}
.nav-title .bar{color:var(--fill2)}
.nav-title > span{font-size:12px;color:var(--label3)}
.nav-back{font-size:14px;font-weight:500;border:1px solid var(--sep);border-radius:var(--r-pill);min-height:36px;padding:0 14px 0 10px;background:var(--bg2);transition:background .2s,border-color .2s}
.nav-back:hover{border-color:var(--fill2);background:var(--fill)}
.nav-back svg{width:18px;height:18px;margin-left:0}
.progress{height:1px;bottom:-1px}
.progress i{background:var(--ink)}
.progress i::after{display:none}

/* sidebar */
.sidebar{background:var(--bg2);border-right:1px solid var(--sep);padding:20px 12px}
.side-h{font-size:12px;font-weight:500;color:var(--label3);letter-spacing:0;margin:0 12px 10px}
.sidebar ol{gap:2px}
.side-row{min-height:44px;padding:6px 10px;border-radius:var(--r-sm);gap:10px;transition:background .15s}
.side-row .ic{width:28px;height:28px;border-radius:var(--r-sm);background:transparent;color:var(--label2);border:1px solid var(--sep)}
.side-row .ic svg{width:16px;height:16px;stroke-width:1.5}
.side-row.done .ic{background:transparent;color:var(--ink)}
.side-row .l{font-size:14px;font-weight:500;letter-spacing:-.01em}
.side-row .s{font-size:12px;color:var(--label3)}
.side-row:not(:disabled):not([aria-current]):hover{background:var(--fill)}
.side-row[aria-current="step"],.side-row[aria-current="page"]{background:var(--fill);color:var(--label)}
.side-row[aria-current="step"] .s,.side-row[aria-current="page"] .s{color:var(--label2)}
.side-row[aria-current="step"] .ic,.side-row[aria-current="page"] .ic{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.side-sep{height:1px;background:var(--sep)}

/* page headings */
#step{padding:40px 48px 120px}
.large-title{font-size:40px;line-height:1.08;font-weight:400;letter-spacing:-.035em}
.lede{font-size:16px;line-height:1.55;color:var(--label2);margin:12px 0 32px}

/* buttons: pills */
.btn{border-radius:var(--r-pill);font-size:14px;font-weight:500;min-height:40px;padding:0 18px;letter-spacing:-.01em;transition:opacity .2s,background .2s,border-color .2s,transform .2s var(--ease)}
.btn:active:not(:disabled){opacity:1;transform:scale(.98)}
.btn.filled{background:var(--ink);color:var(--on-ink)}
.btn.filled:hover:not(:disabled){opacity:.86}
.btn.large{min-height:44px;min-width:160px;border-radius:var(--r-pill);padding:0 24px}
.btn.gray{background:var(--bg2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--sep)}
.btn.gray:hover:not(:disabled){background:var(--fill)}
.btn.small{min-height:32px;font-size:13px;padding:0 14px;border-radius:var(--r-pill)}
.btn.plain{font-weight:500;font-size:14px}
.btn.start{min-height:48px;height:48px;padding:0 28px;border-radius:var(--r-pill);font-size:15px;font-weight:500}
#next{box-shadow:var(--shadow-md)}
.bar-hint{border:1px solid var(--sep);border-radius:var(--r-pill);padding:6px 12px;background:var(--bg2)}

/* segmented control: pill track */
.seg{border-radius:var(--r-pill);padding:3px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--sep)}
.seg button{border-radius:var(--r-pill);min-height:30px;padding:4px 14px;font-weight:500;color:var(--label2);transition:color .15s}
.seg button:hover{color:var(--label)}
.seg button[aria-pressed="true"]{background:var(--bg2);color:var(--label);font-weight:500;box-shadow:0 1px 2px rgba(10,10,10,.08),0 0 0 1px var(--sep)}
.lib-tabs .seg button,.lay-tabs .seg button{min-height:34px}

/* switch: monochrome */
input.switch{width:40px;height:24px;background:var(--fill2)}
input.switch::before{width:20px;height:20px;box-shadow:0 1px 3px rgba(10,10,10,.2)}
input.switch:checked{background:var(--ink)}
input.switch:checked::before{transform:translateX(16px)}
:root[data-theme="dark"] input.switch:checked::before{background:#0A0A0A}

/* option cards */
.opt{border:1px solid var(--sep);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-sm);transition:border-color .2s,box-shadow .25s var(--ease),transform .2s var(--ease)}
.opt:hover:not(:disabled){border-color:var(--fill2);box-shadow:var(--shadow-md)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),var(--shadow-md)}
.opt-t{font-size:18px;font-weight:500;letter-spacing:-.025em}
.opt-d{font-size:14px;color:var(--label2)}
.badge{width:20px;height:20px;border:1px solid var(--fill2);background:var(--bg2)}
.opt[aria-pressed="true"] .badge{background:var(--ink);border-color:var(--ink)}
.badge svg{width:12px;height:12px;color:var(--on-ink)}
.frame,.phone{border-width:1.5px;border-color:var(--label3)}
.opt[aria-pressed="true"] .frame{border-color:var(--ink);background:var(--fill)}
.phone b{opacity:1}
.tile-cv{border-radius:var(--r-md)}
.callout{border:1px solid var(--sep);border-radius:var(--r-md);box-shadow:var(--shadow-sm)}
.callout svg{color:var(--ink)}

/* grouped lists → bordered cards */
.group{gap:8px}
.group-h{font-size:12px;font-weight:500;color:var(--label2);margin:0 4px;letter-spacing:0}
.group-f{font-size:12px;color:var(--label3);margin:0 4px}
.list{border:1px solid var(--sep);border-radius:var(--r-md);box-shadow:var(--shadow-sm)}
.cell{font-size:14px;min-height:48px}
.cell+.cell::before{left:0;height:1px;background:var(--sep);opacity:1;transform:none}
.cell.stack .cl{font-size:12px;color:var(--label3)}
.cell input[type=text],.cell textarea{font-size:15px}
.detail{color:var(--label3)}
.drop strong{color:var(--ink);font-weight:500}
.drop svg{color:var(--ink)}
.slider output{font-size:13px;color:var(--label3)}
input[type=range]{accent-color:var(--ink)}
.sw[aria-pressed="true"]{background:var(--fill);color:var(--ink)}
.sw[aria-pressed="true"] .chips{box-shadow:0 0 0 2px var(--bg2),0 0 0 3.5px var(--ink)}

/* preview & editor */
.preview{background:transparent;border-left:1px solid var(--sep);min-height:calc(100vh - 57px)}
.lib-cell svg.i{color:var(--ink)}
.preview h3{font-size:12px;font-weight:500;color:var(--label3)}
#pv{box-shadow:0 0 0 1px var(--sep),var(--shadow-md)}
.stage{border:1px solid var(--sep);border-radius:var(--r-lg);background:var(--bg2);background-image:radial-gradient(var(--fill2) 1px,transparent 1.2px);background-size:20px 20px}
#main{box-shadow:0 0 0 1px var(--sep),0 24px 48px -24px rgba(10,10,10,.28)}
.acc-head{border:1px solid var(--sep);border-radius:var(--r-md);font-size:14px;font-weight:500;min-height:48px;box-shadow:var(--shadow-sm)}
.acc-item.open .acc-head{border-bottom-color:transparent;font-weight:500}
.acc-item.open .acc-panel{border-top:0}
.aligns button{background:var(--bg2);border:1px solid var(--sep);border-radius:var(--r-pill);font-weight:500;color:var(--label)}
.aligns button:hover{background:var(--fill)}
.done-btn{min-height:40px;font-size:14px}

/* library / live ads */
.lib-card{border:1px solid var(--sep);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
.lib-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.lib-name{font-size:14px;font-weight:500;letter-spacing:-.015em}
.lib-dim{font-size:12px;color:var(--label3)}
.lib-empty{border:1px dashed var(--fill2);background:transparent}
.icon-btn{border-radius:var(--r-pill)}
.sheet{border:1px solid var(--sep);border-radius:var(--r-lg)}
.sheet-head h2{font-size:20px;font-weight:500;letter-spacing:-.025em}

/* welcome */
.welcome .large-title{font-size:40px;font-weight:400;letter-spacing:-.045em}
.w-lede{font-size:14px;line-height:1.6;color:var(--label2);margin-top:24px}
.app-icon{border-radius:var(--r-xl);box-shadow:var(--shadow-md)}

@media (max-width:860px){.large-title{font-size:32px}.welcome .large-title{font-size:32px}#step{padding:24px 18px 110px}}
@media (prefers-reduced-motion:reduce){.lib-card:hover{transform:none}}
.nav-title strong{display:flex;align-items:center;gap:10px}
.nav-logo{height:18px;width:auto;display:block;color:var(--label);flex:none}
.nav-title .bar{margin:0}
.nav-title > span:empty{display:none}
.nav-actions{justify-self:end;display:flex;align-items:center;gap:8px}
.nav-actions .nav-back{justify-self:auto}
.nav-reset{padding:0 14px}
.nav-reset.armed{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.nav-reset[hidden]{display:none}

/* ==========================================================================
   FlyDS (Wayflyer product design system) layer
   Semantic tokens, Inter presets (400/500), 4px spacing, pill buttons,
   Pulse blue for the single primary action, inverse selected states,
   160ms ease-out motion. Radius values follow the FlyDS working
   approximations (sm 4, md 8, lg 12, xl 16, 2xl 24).
   ========================================================================== */
:root{
  --color-bg-neutral-base:#FFFFFF;--color-bg-neutral-subtle:#F9F9F8;--color-bg-neutral-medium:#F5F5F5;--color-bg-neutral-strong:#D9D9D9;--color-bg-neutral-inverse:#0D0D0D;
  --color-bg-accent-strong:#001EFF;--color-bg-accent-subtle:#E4EDFF;--color-bg-status-critical-strong:#C20A0A;
  --color-border-neutral-subtle:#E6E6E5;--color-border-neutral-medium:#D9D9D9;--color-border-neutral-strong:#8D8D8D;--color-border-neutral-inverse:#0D0D0D;
  --color-content-neutral-strong:#0D0D0D;--color-content-neutral-subtle:#707070;--color-content-status-critical:#C20A0A;--color-content-accent-strong:#001EFF;
  --focus-ring:0 0 0 2px #FFFFFF,0 0 0 4px #0D0D0D,0 0 0 8px rgba(0,0,0,.04);
  --focus-ring-accent:0 0 0 2px #FFFFFF,0 0 0 4px #001EFF,0 0 0 8px rgba(0,30,255,.08);
  --focus-ring-critical:0 0 0 2px #FFFFFF,0 0 0 4px #C20A0A,0 0 0 8px rgba(242,13,13,.08);
  --shadow-low:0 0 0 1px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.06);
  --shadow-medium:0 0 0 1px rgba(0,0,0,.04),0 2px 4px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --shadow-high:0 0 0 1px rgba(0,0,0,.03),0 6px 12px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.06);
  --ease-out:cubic-bezier(0,0,.2,1);--ease-in-out:cubic-bezier(.4,0,.2,1);--dur-fast:160ms;--dur-ultra:100ms;--dur-moderate:240ms;--dur-slow:300ms;
  --font-features:"calt","case","ss01","ss02","cv01","cv02","cv03","cv04","cv05","cv07","cv08","cv09","cv10";
  /* map app tokens onto FlyDS semantics */
  --bg:var(--color-bg-neutral-subtle);--bg2:var(--color-bg-neutral-base);--fill:var(--color-bg-neutral-medium);--fill2:var(--color-bg-neutral-strong);
  --label:var(--color-content-neutral-strong);--label2:var(--color-content-neutral-subtle);--label3:var(--color-content-neutral-subtle);
  --sep:var(--color-border-neutral-subtle);--ink:var(--color-bg-neutral-inverse);--on-ink:#FFFFFF;--accent:var(--color-bg-accent-strong);--pink:var(--color-content-status-critical);
  --r-xs:4px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;--r-pill:9999px;
  --shadow-sm:var(--shadow-low);--shadow-md:var(--shadow-medium);--ease:var(--ease-out);
}
:root[data-theme="dark"]{--bg:#0D0D0D;--bg2:#161616;--fill:#1F1F1F;--fill2:#333333;--label:#FFFFFF;--label2:#ACACAC;--label3:#ACACAC;--sep:#333333;--ink:#FFFFFF;--on-ink:#0D0D0D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0D0D;--bg2:#161616;--fill:#1F1F1F;--fill2:#333333;--label:#FFFFFF;--label2:#ACACAC;--label3:#ACACAC;--sep:#333333;--ink:#FFFFFF;--on-ink:#0D0D0D}}

/* typography: body-md default, Inter features */
body{font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4;letter-spacing:0;font-feature-settings:var(--font-features)}
button,input,select,textarea{font-feature-settings:var(--font-features)}
:focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:var(--r-sm)}
.large-title{font-size:32px;line-height:1.2;font-weight:500;letter-spacing:0}                 /* title-lg, once per page */
.welcome .large-title{font-size:40px;line-height:1.2;font-weight:500;letter-spacing:-.01em}   /* requested size, kept as an intentional exception */
.lede{font-size:16px;line-height:1.4;color:var(--label2);margin:8px 0 32px}                 /* body-md */
.w-lede{font-size:14px;line-height:1.4}                                                       /* body-sm */
.group-h,.side-h,.preview h3{font-size:14px;font-weight:500;line-height:1;color:var(--label2)}/* label-sm-strong */
.group-f,.lib-note,.lib-dim,.footnote,.cap-line,.side-row .s,.detail,.slider output,.lay-note{font-size:12px;line-height:1.4;color:var(--label2)} /* body-xs */
.cell,.cell input[type=text],.cell textarea{font-size:14px}                                   /* body-sm */
.cell.stack .cl{font-size:12px;font-weight:500;color:var(--label2)}
.opt-t{font-size:18px;font-weight:500;line-height:1.2;letter-spacing:0}                        /* title-xs */
.opt-d{font-size:14px;line-height:1.4;color:var(--label2)}
.side-row .l,.lib-name{font-size:14px;font-weight:500;letter-spacing:0}
.nav-title strong{font-size:16px;font-weight:500;letter-spacing:0}
.sheet-head h2{font-size:24px;font-weight:500;letter-spacing:0}                               /* title-sm */
.slider output,.lib-n,.nav-title > span{font-variant-numeric:tabular-nums}

/* buttons: pills, LG 40 / MD 32 / SM 24, label presets */
.btn{border-radius:var(--r-pill);font-weight:500;letter-spacing:0;line-height:1;border:0;gap:8px;
  transition:background-color var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform var(--dur-ultra) var(--ease-out)}
.btn:active:not(:disabled){transform:scale(.97);opacity:1}
.btn:disabled{opacity:.4}
.btn.large,.btn.wide,.btn.start{min-height:40px;height:40px;font-size:16px;padding:0 20px;min-width:0}   /* LG, label-md-strong */
.btn.start{min-height:48px;height:48px;padding:0 28px}   /* requested 48px, kept as an intentional exception */
.btn.small{min-height:32px;height:32px;font-size:14px;padding:0 16px}                               /* MD, label-sm-strong */
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--color-bg-accent-strong);color:#FFFFFF;box-shadow:var(--shadow-low)}
.btn.primary:hover:not(:disabled){background:color-mix(in oklch,#001EFF,black 12%);opacity:1}
.btn.primary:focus-visible{box-shadow:var(--focus-ring-accent)}
.btn.filled{background:var(--ink);color:var(--on-ink)}                                               /* secondary (inverse) */
.btn.filled:hover:not(:disabled){background:color-mix(in oklch,var(--ink),white 12%);opacity:1}
.btn.tertiary,.btn.gray{background:var(--bg2);color:var(--label);box-shadow:inset 0 0 0 1px var(--color-border-neutral-medium)}
.btn.tertiary:hover:not(:disabled),.btn.gray:hover:not(:disabled){background:var(--fill)}
.btn.critical{background:var(--color-bg-status-critical-strong);color:#FFFFFF}
.btn.critical:hover{background:color-mix(in oklch,#C20A0A,black 12%)}
.btn.critical:focus-visible{box-shadow:var(--focus-ring-critical)}
.btn.plain{font-size:14px;font-weight:500;color:var(--label)}
.btn.plain:hover{background:var(--fill)}

/* ---------- rendering ---------- */
function render(cv,{els=S.els,guides=false}={}){
  const {w,h}=dims();
  if(cv.width!==w)cv.width=w; if(cv.height!==h)cv.height=h;
  const c=cv.getContext('2d');
  c.clearRect(0,0,w,h);
  c.fillStyle=S.colors.bg;c.fillRect(0,0,w,h);
  if(S.bg.img){
    const r=bgRect();
    c.save();
    if(S.bg.blur>0&&'filter' in c)c.filter=`blur(${S.bg.blur*w/1080}px)`;
    if(S.bg.free){
      const ec=edgeColor(S.bg.img);if(ec){c.fillStyle=ec;c.fillRect(0,0,w,h)}
      c.drawImage(featheredImg(S.bg.img,!!S.bg.flip),r.x,r.y,r.w,r.h);
    }else if(S.bg.flip){c.translate(r.x+r.w,r.y);c.scale(-1,1);c.drawImage(S.bg.img,0,0,r.w,r.h)}
    else c.drawImage(S.bg.img,r.x,r.y,r.w,r.h);
    c.restore();
    const a=S.style.overlay, mode=S.style.overlayMode, col=S.style.overlayColor;
    if(a>0&&mode!=='none'){
      if(mode==='flat'){c.fillStyle=rgba(col,a);}
      else{
        if(mode==='left'){const g=c.createLinearGradient(0,0,w*0.8,0);g.addColorStop(0,rgba(col,a));g.addColorStop(0.45,rgba(col,a*0.7));g.addColorStop(1,rgba(col,0));c.fillStyle=g}
        else{const g=mode==='bottom'?c.createLinearGradient(0,h*0.2,0,h):c.createLinearGradient(0,h*0.8,0,0);
        g.addColorStop(0,rgba(col,0));g.addColorStop(1,rgba(col,a));c.fillStyle=g;}
      }
      c.fillRect(0,0,w,h);
    }
    if(S.style.grain&&S.style.grainDensity>0){
      c.save();c.globalCompositeOperation='overlay';c.globalAlpha=0.42;
      c.fillStyle=c.createPattern(grainTile(S.style.grainDensity),'repeat');c.fillRect(0,0,w,h);c.restore();
    }
  }
  for(const k of ORDER){
    const el=els[k]; if(!el||!el.visible) continue;
    if(el.type==='deco'){if((els._layout||S.layout)==='product')drawProductDeco(c,els,w,h);else drawQuoteDeco(c,els,w,h);continue}
    if(el.type==='product'){drawProductCard(c,el,w);continue}
    if(el.type==='logo'){c.save();c.translate(el.x,el.y);const sc=el.size/28;c.scale(sc,sc);c.fillStyle=el.color;logoPaths().forEach(p=>c.fill(p));c.restore();continue}
    if(el.type==='card'){c.fillStyle=el.color;rr(c,el.x,el.y,el.w,el.h,el.radius);c.fill();continue}
    const m=measure(el,c);
    if(el.type==='button'){
      const shape=S.style.ctaShape, rad=shape==='pill'?m.h/2:shape==='rounded'?el.size*0.32:0;
      c.fillStyle=el.bg;rr(c,m.x,m.y,m.w,m.h,rad);c.fill();
      c.fillStyle=el.color;c.textAlign='center';c.textBaseline='middle';
      c.fillText(S.content.cta||'',m.x+m.w/2,m.y+m.h/2+el.size*0.04);
      continue;
    }
    if(el.dot&&el.align==='left'){const sc=el.size/34.36, cx=el.x-38.5*sc, cy=el.y+el.size*el.lh/2, ac=S.colors.accent||'#001EFF';
      c.save();c.fillStyle=ac;c.strokeStyle=rgba(ac,0.33);c.lineWidth=4.3*sc;c.beginPath();c.arc(cx,cy,13*sc,0,Math.PI*2);c.fill();c.stroke();c.restore();setLS(c,el);c.font=fontOf(el)}
    c.fillStyle=el.color;c.textBaseline='middle';c.textAlign=el.align;
    const lh=el.size*el.lh, ax=el.align==='left'?el.x:el.align==='center'?el.x+el.w/2:el.x+el.w;
    const yo=el.key==='qmark'?el.size*0.3:el.size*0.03;
    m.lines.forEach((ln,i)=>{
      let x=ax;
      if(i===0&&el.hang&&el.align==='left'&&/^["\u201C\u2018']/.test(ln))x-=c.measureText(ln[0]).width;
      c.fillText(ln,x,el.y+i*lh+lh/2+yo);
    });
  }
  setLS(c,null);
  if(guides) drawGuides(c,cv);
}
function drawGuides(c,cv){
  const {w,h}=dims(), z=zones(), {L,R,T,B}=box();
  const dispW=cv.getBoundingClientRect().width||540, s=w/dispW, lw=1.2*s;
  c.save();c.lineWidth=lw;c.strokeStyle=GUIDE;
  if(z.story&&S.guides.safe){
    c.fillStyle='rgba(255,45,85,0.12)';c.fillRect(0,0,w,z.top);c.fillRect(0,h-z.bottom,w,z.bottom);
    c.fillStyle=GUIDE;c.font=`600 ${12*s}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;c.textAlign='left';c.textBaseline='bottom';
    c.fillText('Keep clear: profile and header',L,z.top-8*s);
    c.textBaseline='top';c.fillText('Keep clear: ad button and caption',L,h-z.bottom+8*s);
  }
  if(S.guides.margins){c.setLineDash([]);c.globalAlpha=.85;c.strokeRect(L,T,R-L,B-T);c.globalAlpha=1}
  if(S.guides.center){
    c.setLineDash([7*s,6*s]);c.globalAlpha=.75;
    c.beginPath();c.moveTo(w/2,0);c.lineTo(w/2,h);c.moveTo(0,h/2);c.lineTo(w,h/2);c.stroke();c.globalAlpha=1;
  }
  if(S.guides.thirds){
    c.setLineDash([2*s,5*s]);c.globalAlpha=.8;c.beginPath();
    [w/3,2*w/3].forEach(x=>{c.moveTo(x,0);c.lineTo(x,h)});[h/3,2*h/3].forEach(y=>{c.moveTo(0,y);c.lineTo(w,y)});
    c.stroke();c.globalAlpha=1;
  }
  const sl=S.snapLines;
  if(sl.v.length||sl.h.length){
    c.setLineDash([]);c.lineWidth=lw*1.8;c.beginPath();
    sl.v.forEach(x=>{c.moveTo(x,0);c.lineTo(x,h)});sl.h.forEach(y=>{c.moveTo(0,y);c.lineTo(w,y)});c.stroke();
  }
  if(S.sel&&S.els[S.sel].visible){
    const m=measure(S.els[S.sel],c), p=6*s;
    c.setLineDash([5*s,4*s]);c.lineWidth=lw*1.4;c.strokeStyle=SELC;
    c.strokeRect(m.x-p,m.y-p,m.w+p*2,m.h+p*2);
    c.setLineDash([]);c.fillStyle=SELC;c.font=`600 ${12*s}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
    const label=elName(S.sel), tw=c.measureText(label).width+12*s;
    const ly=m.y-p-20*s<0?m.y+m.h+p:m.y-p-20*s;
    c.fillRect(m.x-p,ly,tw,20*s);c.fillStyle='#fff';c.textAlign='left';c.textBaseline='middle';c.fillText(label,m.x-p+6*s,ly+10*s);
  }
  c.restore();
}

function refresh(){
  ensureEls();
  const main=$('#main');
  if(main) render(main,{guides:true});
  else{
    render($('#pv'));
    const p=S.platform?PLATFORMS[S.platform].name:'Platform not set';
    const pl=S.placement?(S.placement==='story'?'story':'post'):'';
    const d=dims();
    $('#pvCap').textContent=`${p}${pl?' '+pl:''}, ${d.w} × ${d.h} px`;
  }
}
function loadFont(){
  const f=S.style.font;
  return Promise.all([400,600,800].map(wt=>document.fonts.load(`${wt} 40px "${f}"`))).catch(()=>{});

    <div class="cell"><span class="detail" style="font-size:15px;word-break:break-all">${fileName()}</span><span class="detail" style="font-size:15px;white-space:nowrap">${d.w} × ${d.h}</span></div>

function fileName(){

/* ---------- step machinery ---------- */
function summary(id){
  switch(id){
    case 'welcome':return 'What this app does';
    case 'platform':return S.platform?PLATFORMS[S.platform].name:'Not chosen';
    case 'placement':return S.placement?(S.placement==='story'?'Story':'Post'):'Not chosen';
    case 'size':return S.size?SIZES[S.size].w+' × '+SIZES[S.size].h:'Not chosen';
    case 'layout':return LAYOUTS[S.layout];
    case 'content':return S.content.headline||'No headline';
    default:return 'Align and download';
  }
}
function renderRail(){
  $('#rail').innerHTML=STEPS.map((s,i)=>{
    const done=i<S.step, here=i===S.step&&S.view==='steps';
    return `<li><button class="side-row ${done?'done':''}" data-goto="${i}" ${i>S.maxStep?'disabled':''} ${here?'aria-current="step"':''}>
      <span class="ic">${svg(done?ICONS.check:ICONS[s.id])}</span>
      <span class="tx"><span class="l">${s.label}</span><span class="s">${esc(summary(s.id))}</span></span></button></li>`}).join('')
    +`<li class="side-sep" aria-hidden="true"></li><li><button class="side-row lib-row" data-act="open-library" ${S.view==='library'?'aria-current="page"':''}>
      <span class="ic">${svg(ICONS.library)}</span><span class="tx"><span class="l">Library</span><span class="s">${LIB.mode==='loading'?'Shared images':LIB.items.length+(LIB.items.length===1?' image':' images')}</span></span></button></li>
    <li><button class="side-row pub-row" data-act="open-published" ${S.view==='published'?'aria-current="page"':''}>
      <span class="ic">${svg(ICONS.published)}</span><span class="tx"><span class="l">Live Ads</span><span class="s">${pubCountLabel()}</span></span></button></li>`;
}
function canContinue(){return [true,!!S.platform,!!S.placement,!!S.size,true,true,false][S.step]}
function updateNav(){
  $('#back').style.visibility=S.step===0&&S.view==='steps'?'hidden':'visible';
  const rb=$('#resetAll');if(rb){const onWelcome=S.view==='steps'&&STEPS[S.step].id==='welcome';const dirty=!onWelcome&&(!!S.platform||!!S.bg.img||JSON.stringify(S.content)!==JSON.stringify(JSON.parse(S_INIT).content));rb.hidden=!dirty;if(!dirty)resetArm(false)}
  const n=$('#next');
  n.disabled=false;n.setAttribute('aria-describedby','barHint');
  n.textContent=S.step===0?'Get started':S.step>=STEPS.length-2?'Open editor':STEPS[S.step+1].label;
  $('#barHint').textContent=canContinue()?'':['','Choose a platform to continue','Choose post or story to continue','Choose dimensions to continue'][S.step]||'';
  const pg=$('#prog'), pw=(S.step/(STEPS.length-1)*100)+'%';
  if(pg.style.width!==pw){pg.style.width=pw;pg.classList.add('moving');clearTimeout(pg._t);pg._t=setTimeout(()=>pg.classList.remove('moving'),650)}
}
function renderStep(focus=true){
  const id=S.view==='library'?'library':S.view==='published'?'published':STEPS[S.step].id;
  $('#app').classList.toggle('is-library',id==='library'||id==='published');
  $('#app').classList.toggle('is-final',id==='finish');
  const v=$('#step');v.className=id==='finish'?'finish':'';
  $('#stepCount').textContent=id==='library'?'Library':id==='published'?'Live Ads':id==='welcome'?'':`Step ${S.step} of ${STEPS.length-1}`;
  $('#app').classList.toggle('is-welcome',id==='welcome');
  if(id==='finish'&&S.sel===undefined)S.sel=null;
  v.innerHTML=VIEWS[id]();
  renderRail();updateNav();ensureEls();
  if(id==='layout') drawTiles();
  if(id==='welcome') drawSamples();
  if(id==='content') bindUpload();
  if(id==='finish'){bindStage();renderInspector();}
  if(id==='library')bindLibFile();
  if(id==='published')renderPublishedViews();
  refresh();
  if(focus){const hd=v.querySelector('h1');if(hd)hd.focus({preventScroll:true});window.scrollTo(0,0)}
}
function go(i){S.view='steps';S.step=clamp(i,0,STEPS.length-1);S.maxStep=Math.max(S.maxStep,S.step);if(STEPS[S.step].id!=='finish')S.sel=null;renderStep()}
function drawSamples(){
  const keep={size:S.size,placement:S.placement,els:S.els,manual:S.manual};
  document.querySelectorAll('[data-sample]').forEach(cv=>{
    S.size=cv.dataset.sample;S.placement=S.size==='1080x1920'?'story':'post';
    render(cv,{els:buildLayout(S.layout)});
  });
  Object.assign(S,keep);
}
/* Silhouette template: first silhouette in the library, flipped to face the copy */
const SIL={img:null,item:null,loading:null};
function silBgFor(img,item){const d=dims();return {img,src:libSrc(item),name:item.name,zoom:1.15,ox:Math.round(0.3*d.w),oy:Math.round(0.34*d.h),flip:true,blur:0,auto:true,free:true}}
const SIL_STYLE={overlayMode:'left',overlay:0.85,overlayColor:SIL_COLORS.bg};
const BASE_STYLE={overlayMode:'bottom',overlay:0.5,overlayColor:'#000000'};
function loadSilhouette(){
  if(SIL.img)return Promise.resolve(SIL.img);
  if(SIL.loading)return SIL.loading;
  const run=async()=>{
    if(LIB.mode==='loading'&&LIB.ready)await LIB.ready;
    const item=LIB.items.find(x=>libCat(x)==='silhouettes');
    if(!item)return null;
    const im=await new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=libSrc(item)});
    if(im){SIL.img=im;SIL.item=item}
    return im;
  };
  SIL.loading=run().finally(()=>{SIL.loading=null});
  return SIL.loading;
}
async function applySilhouetteBg(){
  const im=await loadSilhouette();
  if(!im||S.layout!=='silhouette'||S.bg.img)return;
  S.bg=silBgFor(im,SIL.item);Object.assign(S.style,SIL_STYLE);
  refresh();
  if(STEPS[S.step].id==='layout')drawTiles();
  if(STEPS[S.step].id==='content'&&S.view==='steps')renderStep(false);
}
function drawTiles(){
  const keep={headline:S.content.headline,body:S.content.body}, keepLayout=S.layout, keepCol=S.colors, keepEls=S.els, keepBg=S.bg;
  const cur=presetKey(S.layout);
  const presetCopy=['headline','body'].every(k=>keep[k]===PRESET_COPY[cur][k]);
  const presetCol=['bg','text','accent','accentText'].every(k=>(S.colors[k]||'').toLowerCase()===PRESET_COLORS[cur][k].toLowerCase());
  document.querySelectorAll('[data-tile]').forEach(cv=>{
    const t=cv.dataset.tile, pk=presetKey(t);
    if(presetCopy)Object.assign(S.content,{headline:PRESET_COPY[pk].headline,body:PRESET_COPY[pk].body});
    if(presetCol)S.colors=PRESET_COLORS[pk];
    S.bg=(t==='silhouette'&&(!keepBg.img||keepBg.auto))?(SIL.img?silBgFor(SIL.img,SIL.item):{...keepBg,img:null}):(keepBg.auto?{...keepBg,img:null}:keepBg);
    const keepStyle={...S.style};if(t==='silhouette'&&S.bg.img&&S.bg.auto)Object.assign(S.style,SIL_STYLE);
    S.els=null;S.layout=t;render(cv,{els:buildLayout(t)});Object.assign(S.style,keepStyle);
  });
  Object.assign(S.content,keep);S.layout=keepLayout;S.colors=keepCol;S.els=keepEls;S.bg=keepBg;
  if(!SIL.img&&!SIL.loading&&document.querySelector('[data-tile="silhouette"]'))loadSilhouette().then(im=>{if(im&&STEPS[S.step].id==='layout')drawTiles()});
}

function setVal(key,val){
  switch(key){
    case 'platform':S.platform=val;break;
    case 'placement':
      S.placement=val;
      if(!PLACEMENT_SIZES[val].includes(S.size))S.size=PLACEMENT_SIZES[val][0];
      S.manual=false;S.els=null;break;
    case 'size':S.size=val;S.manual=false;S.els=null;break;
    case 'layout':{
      const from=presetKey(S.layout), to=presetKey(val);
      const cp=PRESET_COPY[from];
      if(['headline','body'].every(k=>S.content[k]===cp[k]))Object.assign(S.content,{headline:PRESET_COPY[to].headline,body:PRESET_COPY[to].body});
      const pc=PRESET_COLORS[from];
      if(['bg','text','accent','accentText'].every(k=>(S.colors[k]||'').toLowerCase()===pc[k].toLowerCase()))S.colors={...PRESET_COLORS[to]};
      if(from==='silhouette'&&to!=='silhouette'&&S.bg.auto){S.bg={img:null,src:'',name:'',zoom:1,ox:0,oy:0};Object.assign(S.style,BASE_STYLE)}
      S.layout=val;S.manual=false;S.els=null;
      if(to==='silhouette'&&!S.bg.img)applySilhouetteBg();
      if(STEPS[S.step].id==='layout')setTimeout(drawTiles);break;}
    case 'theme':S.theme=val;S.colors={...THEMES[val]};ensureEls();colorize(S.els);syncColorInputs();break;
    case 'font':S.style.font=val;loadFont().then(()=>{reflow();refresh()});break;
    case 'ctaShape':S.style.ctaShape=val;break;
    case 'overlayMode':S.style.overlayMode=val;break;
  }
  document.querySelectorAll(`[data-set="${key}"]`).forEach(b=>b.setAttribute('aria-pressed',b.dataset.val===String(val)));
  if(key==='placement'&&STEPS[S.step].id==='placement')renderStep(false);
  reflow();renderRail();updateNav();refresh();
}

const LIB={tab:'imagery',items:[],mode:'loading',db:null,assets:null,busy:false,msg:'',confirm:null,unsub:null};

const libCat=it=>it.category==='silhouettes'?'silhouettes':'imagery';
const LIB_TABS=[['imagery','Imagery'],['silhouettes','Silhouettes']];
async function initLibrary(){
  const use=n=>(window.claude&&typeof window.claude.use==='function')?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [db,assets]=await Promise.all([use('db'),use('assets')]);
  LIB.db=db;LIB.assets=assets;
  if(!db){LIB.mode='local';LIB.items=BUNDLED_LIBRARY.map(x=>({...x}));PUB.loaded=true;renderLibraryViews();renderPublishedViews();renderRail();return}
  LIB.mode=assets?'cloud':'readonly';
  LIB.unsub=db.collection('library').orderBy('createdAt','desc').limit(500).onSnapshot(
    snap=>{LIB.items=snap.docs.map(d=>({id:d.id,...d.data()}));renderLibraryViews()},
    ()=>{LIB.msg='The library stopped syncing. Reload the page to reconnect.';renderLibraryViews()});
  PUB.unsub=db.collection('published').orderBy('createdAt','desc').limit(500).onSnapshot(
    snap=>{PUB.items=snap.docs.map(d=>({id:d.id,...d.data()}));PUB.loaded=true;renderPublishedViews()},
    ()=>{PUB.msg='Live Ads stopped syncing. Reload the page to reconnect.';renderPublishedViews()});
  renderLibraryViews();
}
function imageSize(file){
  return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{res({w:im.naturalWidth,h:im.naturalHeight});URL.revokeObjectURL(u)};im.onerror=()=>{res({w:0,h:0});URL.revokeObjectURL(u)};im.src=u});
}
const OK_TYPES=['image/png','image/jpeg','image/webp','image/gif'];
async function addToLibrary(file,category=LIB.tab){
  if(!OK_TYPES.includes(file.type)){LIB.msg=`${file.name} was not added. Upload a JPG, PNG, WebP or GIF.`;renderLibraryViews();return null}
  const {w,h}=await imageSize(file);
  if(LIB.mode==='cloud'){
    try{
      const r=await LIB.assets.upload(file);
      const doc={assetId:r.id,name:file.name.replace(/\.[^.]+$/,''),w,h,type:r.contentType,size:r.sizeBytes,createdAt:Date.now(),category};
      await LIB.db.collection('library').doc().set(doc);
      return {...doc};
    }catch(e){
      const c=e&&e.code;
      LIB.msg=c==='too_large'?`${file.name} is over 20 MB. Try a smaller file.`:c==='quota_or_state'||c==='quota_exceeded'?'The library is full. Delete some images and try again.':c==='rate_limited'?'Too many uploads at once. Wait a moment and try again.':`We could not add ${file.name} to the library. Try again.`;
      renderLibraryViews();return null;
    }
  }
  if(LIB.mode==='local'){
    const it={id:'local-'+Date.now()+Math.random().toString(36).slice(2,6),src:URL.createObjectURL(file),name:file.name.replace(/\.[^.]+$/,''),w,h,size:file.size,createdAt:Date.now(),category};
    LIB.items.unshift(it);renderLibraryViews();return it;
  }
  return null;
}
async function uploadMany(files){
  if(LIB.mode==='readonly'||LIB.mode==='loading')return;
  LIB.busy=true;LIB.msg='';renderLibraryViews();
  for(const f of files) await addToLibrary(f);
  LIB.busy=false;renderLibraryViews();
}
async function deleteFromLibrary(id){
  const it=LIB.items.find(x=>x.id===id);if(!it)return;
  LIB.confirm=null;
  if(LIB.mode==='cloud'){
    try{await LIB.db.collection('library').doc(id).delete();await LIB.assets.delete(it.assetId)}
    catch(e){LIB.msg=`We could not delete ${it.name}. Refresh and try again.`;renderLibraryViews()}
  }else if(LIB.mode==='local'){LIB.items=LIB.items.filter(x=>x!==it);if(!it.bundled)URL.revokeObjectURL(it.src);renderLibraryViews()}
}
function useLibraryItem(id){
  const it=LIB.items.find(x=>x.id===id);if(!it)return;
  const im=new Image();
  im.onload=()=>{S.bg=S.layout==='silhouette'?{...silBgFor(im,it),auto:false}:{img:im,src:libSrc(it),name:it.name,zoom:1,ox:0,oy:0};closePicker();

  im.src=libSrc(it);
}

function bindUpload(){
  const file=$('#file'), drop=$('#drop');
  file.onchange=()=>file.files[0]&&loadImage(file.files[0]);
  if(drop){
    drop.onclick=e=>{e.preventDefault();file.click()};
    drop.tabIndex=0;drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click()}};
    ['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
    ['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
    drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)loadImage(f)});
  }
}
function loadImage(f){
  if(!f.type.startsWith('image/')){alert('That file is not an image. Choose a JPG, PNG or WebP.');return}
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{S.bg={img:im,src:rd.result,name:f.name,zoom:1,ox:0,oy:0};renderStep(false)};im.src=rd.result};
  if(LIB.mode==='cloud'||LIB.mode==='local')addToLibrary(f,'imagery');
  rd.readAsDataURL(f);
}

/* ---------- stage interaction ---------- */
let drag=null;
function toCanvas(e,cv){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
function hit(p){
  for(const k of [...ORDER].reverse()){
    const el=S.els[k];if(!el||!el.visible||el.type==='deco')continue;
    const m=measure(el),pad=8;
    if(p.x>=m.x-pad&&p.x<=m.x+m.w+pad&&p.y>=m.y-pad&&p.y<=m.y+m.h+pad)return k;
  }
  return null;
}
function snapLinesFor(skip){
  const {w,h}=dims(), {L,R,T,B}=box();
  const v=[L,R,w/2], hz=[T,B,h/2];
  if(S.guides.thirds){v.push(w/3,2*w/3);hz.push(h/3,2*h/3)}
  for(const k of ORDER){if(k===skip||!S.els[k]||!S.els[k].visible||S.els[k].type==='deco')continue;const m=measure(S.els[k]);v.push(m.x,m.x+m.w);hz.push(m.y,m.y+m.h)}
  return {v,hz};
}
function applySnap(b,skip){
  const th=14*(dims().w/($('#main').getBoundingClientRect().width||540))*0.6+4;
  const {v,hz}=snapLinesFor(skip);
  let bx=null,by=null;
  for(const [px,off] of [[b.x,0],[b.x+b.w/2,b.w/2],[b.x+b.w,b.w]])for(const g of v){const d=Math.abs(px-g);if(d<th&&(!bx||d<bx.d))bx={d,x:g-off,g}}
  for(const [py,off] of [[b.y,0],[b.y+b.h/2,b.h/2],[b.y+b.h,b.h]])for(const g of hz){const d=Math.abs(py-g);if(d<th&&(!by||d<by.d))by={d,y:g-off,g}}
  return {x:bx?bx.x:b.x,y:by?by.y:b.y,lines:{v:bx?[bx.g]:[],h:by?[by.g]:[]}};
}
function bindStage(){
  const cv=$('#main');
  cv.addEventListener('pointerdown',e=>{
    const p=toCanvas(e,cv), k=hit(p);
    cv.setPointerCapture(e.pointerId);
    if(k){
      if(S.sel!==k){S.sel=k;renderInspector()}
      drag={mode:'el',k,dx:p.x-S.els[k].x,dy:p.y-S.els[k].y,moved:false};cv.style.cursor='grabbing';
    }else{
      if(S.sel){S.sel=null;renderInspector()}
      if(S.bg.img){drag={mode:'bg',sx:p.x,sy:p.y,ox:S.bg.ox,oy:S.bg.oy};cv.style.cursor='grabbing'}
    }
    refresh();
  });
  cv.addEventListener('pointermove',e=>{
    const p=toCanvas(e,cv);
    if(!drag){cv.style.cursor=hit(p)?'grab':S.bg.img?'move':'default';return}
    if(drag.mode==='bg'){S.bg.ox=drag.ox+(p.x-drag.sx);S.bg.oy=drag.oy+(p.y-drag.sy);refresh();return}
    const el=S.els[drag.k];
    let nx=p.x-drag.dx, ny=p.y-drag.dy;
    const m=measure({...el,x:nx,y:ny});
    if(S.snap&&!e.altKey){const s=applySnap(m,drag.k);nx=s.x;ny=s.y;S.snapLines=s.lines}else S.snapLines={v:[],h:[]};
    el.x=Math.round(nx);el.y=Math.round(ny);S.manual=true;drag.moved=true;refresh();
  });
  const end=()=>{if(!drag)return;drag=null;S.snapLines={v:[],h:[]};$('#main').style.cursor='default';refresh()};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
}
function alignSel(how){
  const el=S.els[S.sel];if(!el)return;
  const m=measure(el), {L,R,T,B}=box(), {w,h}=dims();
  if(how==='left')el.x=L; if(how==='right')el.x=R-m.w; if(how==='hcenter')el.x=Math.round((w-m.w)/2);
  if(how==='top')el.y=T; if(how==='bottom')el.y=B-m.h; if(how==='vcenter')el.y=Math.round((h-m.h)/2);
  S.manual=true;refresh();
}

/* ---------- reframe ---------- */
function reframe(key){
  if(key===sizeKey())return;
  const b0=box();
  S.size=key;S.placement=key==='1080x1920'?'story':'post';
  if(!S.manual){S.els=null;ensureEls();}
  else{
    const b1=box(), {w,h}=dims();
    const mapY=(y)=>{
      const r=(y-b0.T)/(b0.B-b0.T);
      if(r>0.6)return b1.B-(b0.B-y);
      if(r<0.4)return b1.T+(y-b0.T);
      return b1.T+r*(b1.B-b1.T);
    };
    for(const k of ORDER){
      const el=S.els[k], m=measure(el);
      if(el.type==='card'){
        const top=mapY(el.y), bot=mapY(el.y+el.h);
        el.y=Math.round(top);el.h=Math.max(100,Math.round(bot-top));continue;
      }
      const cy=m.y+m.h/2, r=(cy-b0.T)/(b0.B-b0.T);
      let ny=r>0.6?mapY(m.y+m.h)-m.h:r<0.4?mapY(m.y):mapY(cy)-m.h/2;
      el.y=Math.round(clamp(ny,0,Math.max(0,h-m.h)));
      el.x=Math.round(clamp(el.x,0,Math.max(0,w-m.w)));
    }
  }
  S.snapLines={v:[],h:[]};
  const sv=S.sel;renderStep(false);S.sel=sv;renderInspector();refresh();
}

/* ---------- export ---------- */
async function publishNote(blob,name,st){
  const r=await archiveExport(blob,name);
  st.textContent=r==='saved'?`Exported ${name} and saved it to Live Ads.`:r==='readonly'?`Exported ${name}. Only editors can save ads to Live Ads.`:`Exported ${name}. We could not save it to Live Ads, so export it again to retry.`;
}
async function exportAd(){
  const st=$('#status'), btn=$('#exportBtn');
  btn.disabled=true;st.textContent='Preparing file…';
  try{
    await loadFont();
    const cv=document.createElement('canvas');render(cv,{guides:false});
    const type=S.exp.format==='png'?'image/png':'image/jpeg';
    const blob=await new Promise(r=>cv.toBlob(r,type,S.exp.format==='jpg'?S.exp.quality:undefined));
    const name=fileName();
    const dl=await getDownloads();
    if(dl){
      try{await dl.save({filename:name,data:blob});st.textContent=`Exported ${name}. Saving to Live Ads…`;await publishNote(blob,name,st)}
      catch(err){
        const c=err&&err.code;
        st.textContent=c==='declined'?'Export cancelled.':c==='rate_limited'?'A save prompt is already open. Finish it, then try again.':c==='too_large'?'The file is too large. Try JPG at a lower quality.':'Saving files is not available in this view.';
      }
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      st.textContent=`Exported ${name}. Saving to Live Ads…`;await publishNote(blob,name,st);
    }
  }catch(e){st.textContent='Export failed. Remove the background image and try again.'}
  btn.disabled=false;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.act==='open-library'){openLibrary();return}
  if(t.dataset.act==='open-published'){openPublished();return}
  if(t.dataset.pubfilter){PUB.filter=t.dataset.pubfilter;PUB.confirm=null;renderPublishedViews();return}
  if(t.dataset.pubDl){downloadPublished(t.dataset.pubDl);return}
  if(t.dataset.pubAsk){PUB.confirm=t.dataset.pubAsk;renderPublishedViews();return}
  if(t.dataset.pubDel){deletePublished(t.dataset.pubDel);return}
  if(t.dataset.act==='library-pick'){openPicker();return}
  if(t.dataset.act==='picker-close'){closePicker();return}
  if(t.dataset.act==='lib-upload'){const i=$('#picker #libFile')||$('#libFile');if(i)i.click();return}
  if(t.dataset.libtab){LIB.tab=t.dataset.libtab;LIB.confirm=null;renderLibraryViews();return}
  if(t.dataset.libUse){useLibraryItem(t.dataset.libUse);return}
  if(t.dataset.libAsk){LIB.confirm=t.dataset.libAsk;renderLibraryViews();return}
  if(t.dataset.libDel){deleteFromLibrary(t.dataset.libDel);return}
  if(t.dataset.laytab){S.layoutTab=t.dataset.laytab;renderStep(false);return}
  if(t.dataset.set){setVal(t.dataset.set,t.dataset.val);return}
  if(t.dataset.reframe){reframe(t.dataset.reframe);return}
  if(t.dataset.replat){S.platform=t.dataset.replat;
    t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));
    renderRail();renderInspector();return}
  if(t.dataset.goto!==undefined){go(+t.dataset.goto);return}
  if(t.dataset.act==='remove'){S.bg={img:null,src:'',name:'',zoom:1,ox:0,oy:0};renderStep(false);return}
  if(t.dataset.act==='replace'){$('#file').click();return}
  if(t.id==='resetL'){S.manual=false;S.els=null;S.sel=null;ensureEls();renderInspector();refresh();return}
  if(t.dataset.pick!==undefined){S.sel=t.dataset.pick||null;renderInspector();refresh();return}
  if(t.dataset.propset){const el=S.els[S.sel];el[t.dataset.propset]=t.dataset.propset==='weight'?+t.dataset.val:t.dataset.val;S.manual=true;
    t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));refresh();return}
  if(t.dataset.align){alignSel(t.dataset.align);return}
  if(t.dataset.exp){S.exp.format=t.dataset.exp;renderInspector();return}
  if(t.id==='exportBtn'){exportAd();return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  const out=t.parentElement&&t.parentElement.querySelector('output');
  if(t.dataset.guide){if(t.dataset.guide==='snap')S.snap=t.checked;else S.guides[t.dataset.guide]=t.checked;refresh();return}
  if(t.dataset.content){S.content[t.dataset.content]=t.value;reflow();refresh();
    if(STEPS[S.step].id==='content'&&t.dataset.content==='headline')renderRail();return}
  if(t.hasAttribute('data-bgflip')){S.bg.flip=t.checked;S.bg.auto=false;refresh();return}
  if(t.dataset.bg){S.bg[t.dataset.bg]=+t.value;S.bg.auto=false;if(out)out.textContent=t.dataset.bg==='blur'?t.value+'px':Math.round(t.value*100)+'%';refresh();return}
  if(t.hasAttribute('data-grain')){S.style.grain=t.checked;const d=document.querySelector('[data-style="grainDensity"]');if(d)d.disabled=!t.checked;refresh();return}
  if(t.dataset.style){S.style[t.dataset.style]=t.type==='range'?+t.value:t.value;if(out)out.textContent=Math.round(t.value*100)+'%';refresh();return}
  if(t.dataset.color){S.colors[t.dataset.color]=t.value;ensureEls();colorize(S.els);
    document.querySelectorAll('[data-set="theme"]').forEach(b=>b.setAttribute('aria-pressed','false'));refresh();return}
  if(t.dataset.prop){
    const el=S.els[S.sel];if(!el)return;const p=t.dataset.prop;
    if(p==='visible')el.visible=t.checked;else if(t.type==='range')el[p]=+t.value;else el[p]=t.value;
    if(out)out.textContent=p==='size'?t.value+'px':p==='lh'?(+t.value).toFixed(2):t.value;
    S.manual=true;refresh();return}
  if(t.id==='q'){S.exp.quality=+t.value;if(out)out.textContent=Math.round(t.value*100)+'%'}
});
document.addEventListener('change',e=>{if(e.target.dataset.prop==='visible')renderInspector()});
document.addEventListener('keydown',e=>{
  if(STEPS[S.step].id!=='finish')return;
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const fk={'1':'1080x1080','2':'1080x1350','3':'1080x1920'}[e.key];
  if(fk&&!e.metaKey&&!e.ctrlKey&&!e.altKey){reframe(fk);return}
  if(!S.sel)return;
  const d=e.shiftKey?10:1, el=S.els[S.sel];
  const mv={ArrowLeft:[-d,0],ArrowRight:[d,0],ArrowUp:[0,-d],ArrowDown:[0,d]}[e.key];
  if(mv){e.preventDefault();el.x+=mv[0];el.y+=mv[1];S.manual=true;refresh()}
  if(e.key==='Escape'){S.sel=null;renderInspector();refresh()}
});
let resetTimer=null;
function resetArm(on){const b=$('#resetAll');if(!b)return;clearTimeout(resetTimer);b.classList.toggle('armed',on);b.textContent=on?'Confirm start over':'Start over';if(on)resetTimer=setTimeout(()=>resetArm(false),3500)}
function startOver(){
  const fresh=JSON.parse(S_INIT);
  Object.keys(S).forEach(k=>{if(!(k in fresh))delete S[k]});
  Object.assign(S,fresh);
  closePicker&&closePicker();
  resetArm(false);renderStep();window.scrollTo(0,0);
}
$('#resetAll').onclick=()=>{const b=$('#resetAll');if(b.classList.contains('armed'))startOver();else resetArm(true)};
$('#back').onclick=()=>{if(S.view!=='steps'){S.view='steps';renderStep()}else go(S.step-1)};
$('#next').onclick=()=>{if(canContinue()){go(S.step+1);return}const h=$('#barHint');if(h){h.classList.remove('nudge');void h.offsetWidth;h.classList.add('nudge','critical')}};
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(refresh,80)});

loadFont().then(()=>{reflow();refresh();if(STEPS[S.step].id==='layout')drawTiles();if(STEPS[S.step].id==='welcome')drawSamples()});
document.fonts&&document.fonts.ready.then(()=>{reflow();refresh()});
renderStep(false);
LIB.ready=initLibrary();
</script>
